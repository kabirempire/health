<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .box {
            background: white;
            padding: 50px 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            background: #1a73e8;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 15px;
        }
        a:hover {
            background: #1557b0;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">✅</div>
        <h1>Thank You!</h1>
        <p>Your information has been received successfully.<br>We will get back to you soon.</p>
        <a href="https://kabirempire.github.io/health/">Back to Website</a>
    </div>
</body>
</html>
